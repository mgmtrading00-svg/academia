<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-label="Costes de una operación" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5e6670"/></marker></defs><rect width="900" height="320" fill="#ffffff"/><text x="450" y="34" font-size="18" fill="#1c1f23" font-weight="700" text-anchor="middle"><tspan x="450" dy="0">Coste de una operación de 1 lote de EUR/USD (cifras ilustrativas)</tspan></text><rect x="80" y="90" width="269.09090909090907" height="70" rx="6" fill="#fbe6da" stroke="#c2410c" stroke-width="1.5"/><text x="214.54545454545453" y="132" font-size="16" fill="#c2410c" font-weight="750" text-anchor="middle"><tspan x="214.54545454545453" dy="0">8 $</tspan></text><text x="214.54545454545453" y="190" font-size="12.5" fill="#1c1f23" font-weight="600" text-anchor="middle"><tspan x="214.54545454545453" dy="0">Spread 0,8 pips</tspan></text><rect x="349.09090909090907" y="90" width="235.45454545454547" height="70" rx="6" fill="#e0e8fb" stroke="#1d4ed8" stroke-width="1.5"/><text x="466.8181818181818" y="132" font-size="16" fill="#1d4ed8" font-weight="750" text-anchor="middle"><tspan x="466.8181818181818" dy="0">7 $</tspan></text><text x="466.8181818181818" y="190" font-size="12.5" fill="#1c1f23" font-weight="600" text-anchor="middle"><tspan x="466.8181818181818" dy="0">Comisión 7 $</tspan></text><rect x="584.5454545454545" y="90" width="100.9090909090909" height="70" rx="6" fill="#fdf0d5" stroke="#b45309" stroke-width="1.5"/><text x="635.0" y="132" font-size="16" fill="#b45309" font-weight="750" text-anchor="middle"><tspan x="635.0" dy="0">3 $</tspan></text><text x="635.0" y="190" font-size="12.5" fill="#1c1f23" font-weight="600" text-anchor="middle"><tspan x="635.0" dy="0">Deslizamiento 0,3 pips</tspan></text><rect x="685.4545454545454" y="90" width="134.54545454545453" height="70" rx="6" fill="#efe7fd" stroke="#7c3aed" stroke-width="1.5"/><text x="752.7272727272726" y="132" font-size="16" fill="#7c3aed" font-weight="750" text-anchor="middle"><tspan x="752.7272727272726" dy="0">4 $</tspan></text><text x="752.7272727272726" y="190" font-size="12.5" fill="#1c1f23" font-weight="600" text-anchor="middle"><tspan x="752.7272727272726" dy="0">Swap 1 noche</tspan></text><text x="450" y="240" font-size="17" fill="#1c1f23" font-weight="750" text-anchor="middle"><tspan x="450" dy="0">Total: 22 $ por operación = 2,2 pips</tspan></text><text x="450" y="272" font-size="13.5" fill="#5e6670" font-weight="500" text-anchor="middle"><tspan x="450" dy="0">Si la estrategia busca 10 pips, los costes se llevan el 22 % del beneficio bruto.</tspan></text></svg>