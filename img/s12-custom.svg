125" x2="460" y2="125" stroke="#5e6670" stroke-width="2" marker-end="url(#arr)"/><rect x="460" y="70" width="126" height="110" rx="10" fill="#dcefeb" stroke="#0f766e" stroke-width="1.5"/><text x="523" y="108" font-size="15" fill="#1c1f23" font-weight="700" text-anchor="middle"><tspan x="523" dy="0">Retester</tspan></text><text x="523" y="132" font-size="12" fill="#5e6670" font-weight="600" text-anchor="middle"><tspan x="523" dy="0">Monte Carlo</tspan></text><line x1="586" y1="125" x2="606" y2="125" stroke="#5e6670" stroke-width="2" marker-end="url(#arr)"/><rect x="606" y="70" width="126" height="110" rx="10" fill="#dcefeb" stroke="#0f766e" stroke-width="1.5"/><text x="669" y="108" font-size="15" fill="#1c1f23" font-weight="700" text-anchor="middle"><tspan x="669" dy="0">Optimizer</tspan></text><text x="669" y="132" font-size="12" fill="#5e6670" font-weight="600" text-anchor="middle"><tspan x="669" dy="0">Walk-Forward</tspan></text><line x1="732" y1="125" x2="752" y2="125" stroke="#5e6670" stroke-width="2" marker-end="url(#arr)"/><rect x="752" y="70" width="126" height="110" rx="10" fill="#fdf0d5" stroke="#b45309" stroke-width="1.5"/><text x="815" y="108" font-size="15" fill="#1c1f23" font-weight="700" text-anchor="middle"><tspan x="815" dy="0">Databank</tspan></text><text x="815" y="132" font-size="12" fill="#5e6670" font-weight="600" text-anchor="middle"><tspan x="815" dy="0">finalistas</tspan></text><text x="450" y="220" font-size="13" fill="#5e6670" font-weight="500" text-anchor="middle"><tspan x="450" dy="0">Cada etapa guarda sus supervivientes en un databank propio: así sabes cuántas elimina cada prueba.</tspan></text></svg>