<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-label="Sesgo de anticipación" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5e6670"/></marker></defs><rect width="900" height="260" fill="#ffffff"/><text x="450" y="34" font-size="19" fill="#1c1f23" font-weight="700" text-anchor="middle"><tspan x="450" dy="0">Sesgo de anticipación: decidir con un dato del futuro</tspan></text><line x1="60" y1="140" x2="840" y2="140" stroke="#1c1f23" stroke-width="2"/><circle cx="160" cy="140" r="8" fill="#0f766e" stroke="none" stroke-width="2"/><text x="160" y="175" font-size="13.5" fill="#0f766e" font-weight="700" text-anchor="middle"><tspan x="160" dy="0">Apertura 09:00</tspan><tspan x="160" dy="16.875">(aquí decides)</tspan></text><circle cx="450" cy="140" r="8" fill="#5e6670" stroke="none" stroke-width="2"/><text x="450" y="175" font-size="13.5" fill="#5e6670" font-weight="700" text-anchor="middle"><tspan x="450" dy="0">Mediodía</tspan></text><circle cx="740" cy="140" r="8" fill="#c2410c" stroke="none" stroke-width="2"/><text x="740" y="175" font-size="13.5" fill="#c2410c" font-weight="700" text-anchor="middle"><tspan x="740" dy="0">Cierre 22:00</tspan><tspan x="740" dy="16.875">(aquí se conoce)</tspan></text><path d="M740,120 C620,60 280,60 160,120" stroke="#c2410c" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="450" y="72" font-size="13.5" fill="#c2410c" font-weight="700" text-anchor="middle"><tspan x="450" dy="0">«Comprar a la apertura si el cierre de hoy sube» usa un dato que aún no existe</tspan></text></svg>