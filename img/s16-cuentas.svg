<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="Coste según el tipo de cuenta" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5e6670"/></marker></defs><rect width="900" height="330" fill="#ffffff"/><text x="450" y="34" font-size="18" fill="#1c1f23" font-weight="700" text-anchor="middle"><tspan x="450" dy="0">Coste de una operación de 1 lote de EUR/USD (ilustrativo)</tspan></text><text x="200" y="122" font-size="15" fill="#1c1f23" font-weight="700" text-anchor="end"><tspan x="200" dy="0">Cuenta estándar</tspan></text><rect x="220" y="90" width="360" height="50" rx="6" fill="#fbe6da" stroke="#c2410c" stroke-width="1.5"/><text x="400.0" y="121" font-size="13" fill="#c2410c" font-weight="700" text-anchor="middle"><tspan x="400.0" dy="0">spread 12 $</tspan></text><text x="594" y="122" font-size="16" fill="#1c1f23" font-weight="800" text-anchor="start"><tspan x="594" dy="0">= 12 $</tspan></text><text x="200" y="222" font-size="15" fill="#1c1f23" font-weight="700" text-anchor="end"><tspan x="200" dy="0">Cuenta raw</tspan></text><rect x="220" y="190" width="60" height="50" rx="6" fill="#fbe6da" stroke="#c2410c" stroke-width="1.5"/><text x="250.0" y="260" font-size="13" fill="#c2410c" font-weight="700" text-anchor="middle"><tspan x="250.0" dy="0">spread 2 $</tspan></text><rect x="280" y="190" width="210" height="50" rx="6" fill="#e0e8fb" stroke="#1d4ed8" stroke-width="1.5"/><text x="385.0" y="221" font-size="13" fill="#1d4ed8" font-weight="700" text-anchor="middle"><tspan x="385.0" dy="0">comisión 7 $</tspan></text><text x="504" y="222" font-size="16" fill="#1c1f23" font-weight="800" text-anchor="start"><tspan x="504" dy="0">= 9 $</tspan></text><text x="450" y="300" font-size="12.5" fill="#5e6670" font-weight="500" text-anchor="middle"><tspan x="450" dy="0">Con 1,2 pips de spread frente a 0,2 pips + 7 $ de comisión, la raw sale más barata. Haz la cuenta con tus datos.</tspan></text></svg>