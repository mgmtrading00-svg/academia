<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="Apalancamiento y margen" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5e6670"/></marker></defs><rect width="900" height="360" fill="#ffffff"/><text x="450" y="34" font-size="18" fill="#1c1f23" font-weight="700" text-anchor="middle"><tspan x="450" dy="0">Apalancamiento 30:1 sobre una posición de 30.000 €</tspan></text><rect x="80" y="70" width="740" height="70" rx="10" fill="#e0e8fb" stroke="#1d4ed8" stroke-width="1.5"/><text x="450" y="112" font-size="15" fill="#1d4ed8" font-weight="650" text-anchor="middle"><tspan x="450" dy="0">Exposición total: 30.000 € (lo que de verdad se mueve con el mercado)</tspan></text><rect x="80" y="160" width="24.666666666666668" height="70" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="120" y="202" font-size="15" fill="#0f766e" font-weight="650" text-anchor="start"><tspan x="120" dy="0">Margen retenido: 1.000 € (1/30)</tspan></text><rect x="80" y="250" width="740" height="80" rx="10" fill="#fdf0d5" stroke="#b45309" stroke-width="1.5"/><text x="450" y="282" font-size="15" fill="#1c1f23" font-weight="700" text-anchor="middle"><tspan x="450" dy="0">Un movimiento del 1 % en contra = 300 € de pérdida</tspan></text><text x="450" y="308" font-size="13.5" fill="#5e6670" font-weight="500" text-anchor="middle"><tspan x="450" dy="0">es decir, un 30 % del margen. El apalancamiento multiplica el resultado, no el acierto.</tspan></text></svg>