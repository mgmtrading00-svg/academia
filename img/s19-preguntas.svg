<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="Las cuatro preguntas fiscales" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5e6670"/></marker></defs><rect width="900" height="300" fill="#ffffff"/><text x="450" y="34" font-size="19" fill="#1c1f23" font-weight="700" text-anchor="middle"><tspan x="450" dy="0">Las cuatro preguntas fiscales del trading</tspan></text><rect x="30" y="70" width="195" height="190" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5"/><text x="127" y="110" font-size="15" fill="#0f766e" font-weight="750" text-anchor="middle"><tspan x="127" dy="0">¿Dónde soy</tspan><tspan x="127" dy="18.75">residente fiscal?</tspan></text><text x="127" y="190" font-size="13" fill="#1c1f23" font-weight="500" text-anchor="middle"><tspan x="127" dy="0">allí tributas por</tspan><tspan x="127" dy="16.25">todas tus rentas</tspan></text><rect x="245" y="70" width="195" height="190" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5"/><text x="342" y="110" font-size="15" fill="#0f766e" font-weight="750" text-anchor="middle"><tspan x="342" dy="0">¿Qué tipo de</tspan><tspan x="342" dy="18.75">renta es?</tspan></text><text x="342" y="190" font-size="13" fill="#1c1f23" font-weight="500" text-anchor="middle"><tspan x="342" dy="0">ganancia, actividad,</tspan><tspan x="342" dy="16.25">servicio…</tspan></text><rect x="460" y="70" width="195" height="190" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5"/><text x="557" y="110" font-size="15" fill="#0f766e" font-weight="750" text-anchor="middle"><tspan x="557" dy="0">¿Cómo compenso</tspan><tspan x="557" dy="18.75">las pérdidas?</tspan></text><text x="557" y="190" font-size="13" fill="#1c1f23" font-weight="500" text-anchor="middle"><tspan x="557" dy="0">con qué rentas y</tspan><tspan x="557" dy="16.25">durante cuántos años</tspan></text><rect x="675" y="70" width="195" height="190" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5"/><text x="772" y="110" font-size="15" fill="#0f766e" font-weight="750" text-anchor="middle"><tspan x="772" dy="0">¿Qué debo</tspan><tspan x="772" dy="18.75">informar?</tspan></text><text x="772" y="190" font-size="13" fill="#1c1f23" font-weight="500" text-anchor="middle"><tspan x="772" dy="0">cuentas y cripto</tspan><tspan x="772" dy="16.25">en el extranjero</tspan></text></svg>