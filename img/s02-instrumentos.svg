<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="Contado, CFD y futuros" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5e6670"/></marker></defs><rect width="900" height="330" fill="#ffffff"/><text x="450" y="34" font-size="19" fill="#1c1f23" font-weight="700" text-anchor="middle"><tspan x="450" dy="0">Tres formas de exponerse al mismo activo</tspan></text><rect x="40" y="60" width="255" height="250" rx="10" fill="#dcefeb" stroke="#0f766e" stroke-width="1.5"/><text x="167" y="95" font-size="18" fill="#0f766e" font-weight="750" text-anchor="middle"><tspan x="167" dy="0">Contado</tspan></text><text x="62" y="140" font-size="14" fill="#1c1f23" font-weight="500" text-anchor="start"><tspan x="62" dy="0">• Compras el activo</tspan></text><text x="62" y="180" font-size="14" fill="#1c1f23" font-weight="500" text-anchor="start"><tspan x="62" dy="0">• Sin apalancamiento</tspan></text><text x="62" y="220" font-size="14" fill="#1c1f23" font-weight="500" text-anchor="start"><tspan x="62" dy="0">• Sin vencimiento</tspan></text><text x="62" y="260" font-size="14" fill="#1c1f23" font-weight="500" text-anchor="start"><tspan x="62" dy="0">• Coste: comisión + spread</tspan></text><rect x="325" y="60" width="255" height="250" rx="10" fill="#e0e8fb" stroke="#1d4ed8" stroke-width="1.5"/><text x="452" y="95" font-size="18" fill="#1d4ed8" font-weight="750" text-anchor="middle"><tspan x="452" dy="0">CFD</tspan></text><text x="347" y="140" font-size="14" fill="#1c1f23" font-weight="500" text-anchor="start"><tspan x="347" dy="0">• Contrato con el broker</tspan></text><text x="347" y="180" font-size="14" fill="#1c1f23" font-weight="500" text-anchor="start"><tspan x="347" dy="0">• Apalancado (límites UE)</tspan></text><text x="347" y="220" font-size="14" fill="#1c1f23" font-weight="500" text-anchor="start"><tspan x="347" dy="0">• Sin vencimiento</tspan></text><text x="347" y="260" font-size="14" fill="#1c1f23" font-weight="500" text-anchor="start"><tspan x="347" dy="0">• Coste: spread + financiación</tspan></text><rect x="610" y="60" width="255" height="250" rx="10" fill="#fdf0d5" stroke="#b45309" stroke-width="1.5"/><text x="737" y="95" font-size="18" fill="#b45309" font-weight="750" text-anchor="middle"><tspan x="737" dy="0">Futuro</tspan></text><text x="632" y="140" font-size="14" fill="#1c1f23" font-weight="500" text-anchor="start"><tspan x="632" dy="0">• Contrato en un mercado</tspan></text><text x="632" y="180" font-size="14" fill="#1c1f23" font-weight="500" text-anchor="start"><tspan x="632" dy="0">• Apalancado por margen</tspan></text><text x="632" y="220" font-size="14" fill="#1c1f23" font-weight="500" text-anchor="start"><tspan x="632" dy="0">• Vence: hay que renovar</tspan></text><text x="632" y="260" font-size="14" fill="#1c1f23" font-weight="500" text-anchor="start"><tspan x="632" dy="0">• Coste: comisión + spread</tspan></text></svg>