itucionales</tspan></text><text x="750" y="112" font-size="12" fill="#5e6670" font-weight="400" text-anchor="middle"><tspan x="750" dy="0">grandes volúmenes</tspan></text><rect x="45" y="282" width="210" height="78" rx="10" fill="#fff" stroke="#d9d5cb" stroke-width="1.5"/><text x="150" y="312" font-size="14.5" fill="#1c1f23" font-weight="650" text-anchor="middle"><tspan x="150" dy="0">Empresas</tspan><tspan x="150" dy="18.125">(coberturas)</tspan></text><text x="150" y="352" font-size="12" fill="#5e6670" font-weight="400" text-anchor="middle"><tspan x="150" dy="0">cubren riesgos</tspan></text><rect x="645" y="282" width="210" height="78" rx="10" fill="#fff" stroke="#d9d5cb" stroke-width="1.5"/><text x="750" y="312" font-size="14.5" fill="#1c1f23" font-weight="650" text-anchor="middle"><tspan x="750" dy="0">Minoristas</tspan></text><text x="750" y="352" font-size="12" fill="#5e6670" font-weight="400" text-anchor="middle"><tspan x="750" dy="0">tú y yo</tspan></text><rect x="345" y="282" width="210" height="78" rx="10" fill="#fff" stroke="#d9d5cb" stroke-width="1.5"/><text x="450" y="312" font-size="14.5" fill="#1c1f23" font-weight="650" text-anchor="middle"><tspan x="450" dy="0">Algoritmos y</tspan><tspan x="450" dy="18.125">alta frecuencia</tspan></text><text x="450" y="352" font-size="12" fill="#5e6670" font-weight="400" text-anchor="middle"><tspan x="450" dy="0">velocidad</tspan></text></svg>