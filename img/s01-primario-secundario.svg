<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="Mercado primario y secundario" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5e6670"/></marker></defs><rect width="900" height="330" fill="#ffffff"/><text x="450" y="34" font-size="19" fill="#1c1f23" font-weight="700" text-anchor="middle"><tspan x="450" dy="0">Mercado primario y mercado secundario</tspan></text><rect x="30" y="60" width="400" height="250" rx="10" fill="#dcefeb" stroke="#0f766e" stroke-width="1.5"/><text x="230" y="92" font-size="13" fill="#0f766e" font-weight="700" text-anchor="middle"><tspan x="230" dy="0">PRIMARIO · se crean los activos</tspan></text><rect x="60" y="120" width="150" height="70" rx="10" fill="#fbfaf7" stroke="#d9d5cb" stroke-width="1.5"/><text x="135.0" y="153.0" font-size="16" fill="#1c1f23" font-weight="650" text-anchor="middle"><tspan x="135.0" dy="0">Empresa</tspan></text><text x="135.0" y="173.0" font-size="12.5" fill="#5e6670" font-weight="400" text-anchor="middle"><tspan x="135.0" dy="0">emite acciones</tspan></text><rect x="250" y="120" width="150" height="70" rx="10" fill="#fbfaf7" stroke="#d9d5cb" stroke-width="1.5"/><text x="325.0" y="153.0" font-size="16" fill="#1c1f23" font-weight="650" text-anchor="middle"><tspan x="325.0" dy="0">Inversores</tspan></text><text x="325.0" y="173.0" font-size="12.5" fill="#5e6670" font-weight="400" text-anchor="middle"><tspan x="325.0" dy="0">pagan dinero</tspan></text><line x1="210" y1="145" x2="250" y2="145" stroke="#5e6670" stroke-width="2" marker-end="url(#arr)"/><line x1="250" y1="170" x2="210" y2="170" stroke="#5e6670" stroke-width="2" marker-end="url(#arr)"/><text x="230" y="230" font-size="13.5" fill="#1c1f23" font-weight="400" text-anchor="middle"><tspan x="230" dy="0">La empresa recibe el dinero</tspan><tspan x="230" dy="16.875">(salida a bolsa, ampliación)</tspan></text><rect x="470" y="60" width="400" height="250" rx="10" fill="#e0e8fb" stroke="#1d4ed8" stroke-width="1.5"/><text x="670" y="92" font-size="13" fill="#1d4ed8" font-weight="700" text-anchor="middle"><tspan x="670" dy="0">SECUNDARIO · se negocian entre sí</tspan></text><rect x="500" y="120" width="150" height="70" rx="10" fill="#fbfaf7" stroke="#d9d5cb" stroke-width="1.5"/><text x="575.0" y="153.0" font-size="16" fill="#1c1f23" font-weight="650" text-anchor="middle"><tspan x="575.0" dy="0">Inversor A</tspan></text><text x="575.0" y="173.0" font-size="12.5" fill="#5e6670" font-weight="400" text-anchor="middle"><tspan x="575.0" dy="0">vende</tspan></text><rect x="690" y="120" width="150" height="70" rx="10" fill="#fbfaf7" stroke="#d9d5cb" stroke-width="1.5"/><text x="765.0" y="153.0" font-size="16" fill="#1c1f23" font-weight="650" text-anchor="middle"><tspan x="765.0" dy="0">Inversor B</tspan></text><text x="765.0" y="173.0" font-size="12.5" fill="#5e6670" font-weight="400" text-anchor="middle"><tspan x="765.0" dy="0">compra</tspan></text><line x1="650" y1="145" x2="690" y2="145" stroke="#5e6670" stroke-width="2" marker-end="url(#arr)"/><line x1="690" y1="170" x2="650" y2="170" stroke="#5e6670" stroke-width="2" marker-end="url(#arr)"/><text x="670" y="230" font-size="13.5" fill="#1c1f23" font-weight="400" text-anchor="middle"><tspan x="670" dy="0">La empresa no recibe nada:</tspan><tspan x="670" dy="16.875">aquí operan los traders</tspan></text></svg>