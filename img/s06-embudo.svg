<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="El embudo de la investigación" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5e6670"/></marker></defs><rect width="900" height="380" fill="#ffffff"/><text x="450" y="34" font-size="17" fill="#1c1f23" font-weight="700" text-anchor="middle"><tspan x="450" dy="0">El embudo: de cientos de miles a unas pocas candidatas (cifras ilustrativas)</tspan></text><rect x="50.0" y="60" width="800" height="50" rx="8" fill="#fff" stroke="#5e6670" stroke-width="1.5"/><text x="450" y="82" font-size="17" fill="#5e6670" font-weight="800" text-anchor="middle"><tspan x="450" dy="0">300.000</tspan></text><text x="450" y="100" font-size="12" fill="#1c1f23" font-weight="500" text-anchor="middle"><tspan x="450" dy="0">Estrategias probadas por el Builder</tspan></text><rect x="150.0" y="120" width="600" height="50" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/><text x="450" y="142" font-size="17" fill="#1d4ed8" font-weight="800" text-anchor="middle"><tspan x="450" dy="0">500</tspan></text><text x="450" y="160" font-size="12" fill="#1c1f23" font-weight="500" text-anchor="middle"><tspan x="450" dy="0">Pasan los filtros dentro de muestra</tspan></text><rect x="240.0" y="180" width="420" height="50" rx="8" fill="#dcefeb" stroke="#0f766e" stroke-width="1.5"/><text x="450" y="202" font-size="17" fill="#0f766e" font-weight="800" text-anchor="middle"><tspan x="450" dy="0">40</tspan></text><text x="450" y="220" font-size="12" fill="#1c1f23" font-weight="500" text-anchor="middle"><tspan x="450" dy="0">Mantienen la ventaja fuera de muestra</tspan></text><rect x="285.0" y="240" width="330" height="50" rx="8" fill="#dcefeb" stroke="#0f766e" stroke-width="1.5"/><text x="450" y="262" font-size="17" fill="#0f766e" font-weight="800" text-anc