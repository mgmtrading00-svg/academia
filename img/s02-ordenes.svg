<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Tipos de órdenes respecto al precio" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5e6670"/></marker></defs><rect width="900" height="420" fill="#ffffff"/><text x="450" y="34" font-size="19" fill="#1c1f23" font-weight="700" text-anchor="middle"><tspan x="450" dy="0">Dónde se coloca cada orden pendiente</tspan></text><line x1="120" y1="220" x2="820" y2="220" stroke="#1c1f23" stroke-width="2.5"/><text x="110" y="226" font-size="14" fill="#1c1f23" font-weight="700" text-anchor="end"><tspan x="110" dy="0">Precio actual</tspan></text><line x1="120" y1="90" x2="820" y2="90" stroke="#0f766e" stroke-width="2" stroke-dasharray="7 5"/><rect x="130" y="74" width="120" height="32" rx="6" fill="#fff" stroke="#0f766e" stroke-width="1.5"/><text x="190" y="95" font-size="14" fill="#0f766e" font-weight="700" text-anchor="middle"><tspan x="190" dy="0">Buy Stop</tspan></text><rect x="262" y="77" width="332.09999999999997" height="26" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="270" y="95" font-size="13.5" fill="#1c1f23" font-weight="500" text-anchor="start"><tspan x="270" dy="0">compra si el precio SUBE hasta aquí (ruptura)</tspan></text><line x1="120" y1="150" x2="820" y2="150" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5"/><rect x="130" y="134" width="120" height="32" rx="6" fill="#fff" stroke="#c2410c" stroke-width="1.5"/><text x="190" y="155" font-size="14" fill="#c2410c" font-weight="700" text-anchor="middle"><tspan x="190" dy="0">Sell Limit</tspan></text><rect x="262" y="137" width="317.34" height="26" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="270" y="155" font-size="13.5" fill="#1c1f23" font-weight="500" text-anchor="start"><tspan x="270" dy="0">vende si el precio SUBE hasta aquí (vuelta)</tspan></text><line x1="120" y1="290" x2="820" y2="290" stroke="#0f766e" stroke-width="2" stroke-dasharray="7 5"/><rect x="130" y="274" width="120" height="32" rx="6" fill="#fff" stroke="#0f766e" stroke-width="1.5"/><text x="190" y="295" font-size="14" fill="#0f766e" font-weight="700" text-anchor="middle"><tspan x="190" dy="0">Buy Limit</tspan></text><rect x="262" y="277" width="324.71999999999997" height="26" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="270" y="295" font-size="13.5" fill="#1c1f23" font-weight="500" text-anchor="start"><tspan x="270" dy="0">compra si el precio BAJA hasta aquí (vuelta)</tspan></text><line x1="120" y1="350" x2="820" y2="350" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5"/><rect x="130" y="334" width="120" height="32" rx="6" fill="#fff" stroke="#c2410c" stroke-width="1.5"/><text x="190" y="355" font-size="14" fill="#c2410c" font-weight="700" text-anchor="middle"><tspan x="190" dy="0">Sell Stop</tspan></text><rect x="262" y="337" width="324.71999999999997" height="26" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="270" y="355" font-size="13.5" fill="#1c1f23" font-weight="500" text-anchor="start"><tspan x="270" dy="0">vende si el precio BAJA hasta aquí (ruptura)</tspan></text><text x="450" y="405" font-size="13.5" fill="#5e6670" font-weight="600" text-anchor="middle"><tspan x="450" dy="0">Regla: «stop» espera que el movimiento siga; «limit» espera que se dé la vuelta.</tspan></text></svg>