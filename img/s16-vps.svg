<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="Esquema con VPS" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5e6670"/></marker></defs><rect width="900" height="300" fill="#ffffff"/><text x="450" y="34" font-size="19" fill="#1c1f23" font-weight="700" text-anchor="middle"><tspan x="450" dy="0">Ejecución con VPS</tspan></text><rect x="40" y="110" width="200" height="90" rx="10" fill="#fff" stroke="#d9d5cb" stroke-width="1.5"/><text x="140.0" y="153.0" font-size="16" fill="#1c1f23" font-weight="650" text-anchor="middle"><tspan x="140.0" dy="0">Tu ordenador o móvil</tspan></text><text x="140.0" y="173.0" font-size="12.5" fill="#5e6670" font-weight="400" text-anchor="middle"><tspan x="140.0" dy="0">solo supervisas</tspan></text><rect x="350" y="90" width="220" height="130" rx="10" fill="#dcefeb" stroke="#0f766e" stroke-width="1.5"/><text x="460.0" y="153.0" font-size="16" fill="#1c1f23" font-weight="650" text-anchor="middle"><tspan x="460.0" dy="0">VPS (24 h)</tspan></text><text x="460.0" y="173.0" font-size="12.5" fill="#5e6670" font-weight="400" text-anchor="middle"><tspan x="460.0" dy="0">MT4 / MT5 + EA</tspan><tspan x="460.0" dy="15.625">cerca del broker</tspan></text><rect x="680" y="110" width="180" height="90" rx="10" fill="#e0e8fb" stroke="#1d4ed8" stroke-width="1.5"/><text x="770.0" y="153.0" font-size="16" fill="#1c1f23" font-weight="650" text-anchor="middle"><tspan x="770.0" dy="0">Servidor del broker</tspan></text><text x="770.0" y="173.0" font-size="12.5" fill="#5e6670" font-weight="400" text-anchor="middle"><tspan x="770.0" dy="0">ejecuta las órdenes</tspan></text><line x1="240" y1="155" x2="348" y2="155" stroke="#5e6670" stroke-width="2" marker-end="url(#arr)"/><text x="294.0" y="147.0" font-size="12.5" fill="#5e6670" font-weight="400" text-anchor="middle"><tspan x="294.0" dy="0">escritorio remoto</tspan></text><line x1="570" y1="155" x2="678" y2="155" stroke="#0f766e" stroke-width="2" marker-end="url(#arr)"/><text x="624.0" y="147.0" font-size="12.5" fill="#5e6670" font-weight="400" text-anchor="middle"><tspan x="624.0" dy="0">baja latencia</tspan></text><text x="450" y="270" font-size="13" fill="#5e6670" font-weight="500" text-anchor="middle"><tspan x="450" dy="0">Si tu ordenador se apaga, la cartera sigue operando; si el VPS falla, lo verás en la revisión diaria.</tspan></text></svg>