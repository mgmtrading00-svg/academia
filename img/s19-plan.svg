<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="Plan de capital por fases" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5e6670"/></marker></defs><rect width="900" height="300" fill="#ffffff"/><text x="450" y="34" font-size="19" fill="#1c1f23" font-weight="700" text-anchor="middle"><tspan x="450" dy="0">Un plan de capital por fases (esquema)</tspan></text><rect x="25" y="160" width="150" height="70" rx="10" fill="#dcefeb" stroke="#0f766e" stroke-width="1.5"/><text x="100" y="186" font-size="14" fill="#5e6670" font-weight="700" text-anchor="middle"><tspan x="100" dy="0">Fase 0</tspan></text><text x="100" y="210" font-size="16" fill="#1c1f23" font-weight="800" text-anchor="middle"><tspan x="100" dy="0">Demo</tspan></text><text x="100" y="255" font-size="12" fill="#5e6670" font-weight="600" text-anchor="middle"><tspan x="100" dy="0">incubación ≥ 3 meses</tspan></text><rect x="197" y="135" width="150" height="95" rx="10" fill="#dcefeb" stroke="#0f766e" stroke-width="1.5"/><text x="272" y="161" font-size="14" fill="#5e6670" font-weight="700" text-anchor="middle"><tspan x="272" dy="0">Fase 1</tspan></text><text x="272" y="185" font-size="16" fill="#1c1f23" font-weight="800" text-anchor="middle"><tspan x="272" dy="0">500–1.000 €</tspan></text><text x="272" y="255" font-size="12" fill="#5e6670" font-weight="600" text-anchor="middle"><tspan x="272" dy="0">medir ejecución</tspan></text><rect x="369" y="110" width="150" height="120" rx="10" fill="#dcefeb" stroke="#0f766e" stroke-width="1.5"/><text x="444" y="136" font-size="14" fill="#5e6670" font-weight="700" text-anchor="middle"><tspan x="444" dy="0">Fase 2</tspan></text><text x="444" y="160" font-size="16" fill="#1c1f23" font-weight="800" text-anchor="middle"><tspan x="444" dy="0">× 2</tspan></text><text x="444" y="255" font-size="12" fill="#5e6670" font-weight="600" text-anchor="middle"><tspan x="444" dy="0">si se cumplen los hitos</tspan></text><rect x="541" y="85" width="150" height="145" rx="10" fill="#dcefeb" stroke="#0f766e" stroke-width="1.5"/><text x="616" y="111" font-size="14" fill="#5e6670" font-weight="700" text-anchor="middle"><tspan x="616" dy="0">Fase 3</tspan></text><text x="616" y="135" font-size="16" fill="#1c1f23" font-weight="800" text-anchor="middle"><tspan x="616" dy="0">× 2</tspan></text><text x="616" y="255" font-size="12" fill="#5e6670" font-weight="600" text-anchor="middle"><tspan x="616" dy="0">si se cumplen los hitos</tspan></text><rect x="713" y="110" width="150" height="120" rx="10" fill="#fdf0d5" stroke="#b45309" stroke-width="1.5"/><text x="788" y="136" font-size="14" fill="#5e6670" font-weight="700" text-anchor="middle"><tspan x="788" dy="0">Revisión</tspan></text><text x="788" y="160" font-size="16" fill="#1c1f23" font-weight="800" text-anchor="middle"><tspan x="788" dy="0">trimestral</tspan></text><text x="788" y="255" font-size="12" fill="#5e6670" font-weight="600" text-anchor="middle"><tspan x="788" dy="0">riesgo, retiradas, impuestos</tspan></text></svg>