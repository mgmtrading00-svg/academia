<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-label="Dimensiones de diversificación" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5e6670"/></marker></defs><rect width="900" height="320" fill="#ffffff"/><text x="450" y="34" font-size="19" fill="#1c1f23" font-weight="700" text-anchor="middle"><tspan x="450" dy="0">Cinco dimensiones de diversificación</tspan></text><rect x="30" y="80" width="150" height="170" rx="10" fill="#dcefeb" stroke="#0f766e" stroke-width="1.5"/><text x="105" y="120" font-size="16" fill="#0f766e" font-weight="750" text-anchor="middle"><tspan x="105" dy="0">Lógica</tspan></text><text x="105" y="160" font-size="12.5" fill="#1c1f23" font-weight="500" text-anchor="middle"><tspan x="105" dy="0">tendencia · ruptura</tspan><tspan x="105" dy="15.625">reversión · volatilidad</tspan></text><rect x="202" y="80" width="150" height="170" rx="10" fill="#dcefeb" stroke="#0f766e" stroke-width="1.5"/><text x="277" y="120" font-size="16" fill="#0f766e" font-weight="750" text-anchor="middle"><tspan x="277" dy="0">Mercado</tspan></text><text x="277" y="160" font-size="12.5" fill="#1c1f23" font-weight="500" text-anchor="middle"><tspan x="277" dy="0">divisas · índices</tspan><tspan x="277" dy="15.625">materias primas · cripto</tspan></text><rect x="374" y="80" width="150" height="170" rx="10" fill="#dcefeb" stroke="#0f766e" stroke-width="1.5"/><text x="449" y="120" font-size="16" fill="#0f766e" font-weight="750" text-anchor="middle"><tspan x="449" dy="0">Temporalidad</tspan></text><text x="449" y="160" font-size="12.5" fill="#1c1f23" font-weight="500" text-anchor="middle"><tspan x="449" dy="0">H1 · H4 · D1</tspan></text><rect x="546" y="80" width="150" height="170" rx="10" fill="#dcefeb" stroke="#0f766e" stroke-width="1.5"/><text x="621" y="120" font-size="16" fill="#0f766e" font-weight="750" text-anchor="middle"><tspan x="621" dy="0">Dirección</tspan></text><text x="621" y="160" font-size="12.5" fill="#1c1f23" font-weight="500" text-anchor="middle"><tspan x="621" dy="0">largos · cortos</tspan><tspan x="621" dy="15.625">simétricas</tspan></text><rect x="718" y="80" width="150" height="170" rx="10" fill="#dcefeb" stroke="#0f766e" stroke-width="1.5"/><text x="793" y="120" font-size="16" fill="#0f766e" font-weight="750" text-anchor="middle"><tspan x="793" dy="0">Horario</tspan></text><text x="793" y="160" font-size="12.5" fill="#1c1f23" font-weight="500" text-anchor="middle"><tspan x="793" dy="0">Asia · Europa</tspan><tspan x="793" dy="15.625">América</tspan></text><text x="450" y="290" font-size="13" fill="#5e6670" font-weight="500" text-anchor="middle"><tspan x="450" dy="0">Cuantas más dimensiones distintas combine la cartera, menos probable es que todo falle a la vez.</tspan></text></svg>