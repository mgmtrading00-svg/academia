<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-label="De SQX a MetaTrader" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5e6670"/></marker></defs><rect width="900" height="260" fill="#ffffff"/><text x="450" y="34" font-size="19" fill="#1c1f23" font-weight="700" text-anchor="middle"><tspan x="450" dy="0">De SQX a un gráfico de MetaTrader</tspan></text><rect x="25" y="70" width="150" height="120" rx="10" fill="#dcefeb" stroke="#0f766e" stroke-width="1.5"/><text x="100" y="105" font-size="15" fill="#1c1f23" font-weight="750" text-anchor="middle"><tspan x="100" dy="0">1. Exportar</tspan></text><text x="100" y="135" font-size="12" fill="#5e6670" font-weight="600" text-anchor="middle"><tspan x="100" dy="0">SQX → .mq4 / .mq5</tspan></text><line x1="175" y1="130" x2="197" y2="130" stroke="#5e6670" stroke-width="2" marker-end="url(#arr)"/><rect x="197" y="70" width="150" height="120" rx="10" fill="#dcefeb" stroke="#0f766e" stroke-width="1.5"/><text x="272" y="105" font-size="15" fill="#1c1f23" font-weight="750" text-anchor="middle"><tspan x="272" dy="0">2. Carpeta</tspan></text><text x="272" y="135" font-size="12" fill="#5e6670" font-weight="600" text-anchor="middle"><tspan x="272" dy="0">Archivo → Abrir</tspan><tspan x="272" dy="15.0">carpeta de datos</tspan></text><line x1="347" y1="130" x2="369" y2="130" stroke="#5e6670" stroke-width="2" marker-end="url(#arr)"/><rect x="369" y="70" width="150" height="120" rx="10" fill="#dcefeb" stroke="#0f766e" stroke-width="1.5"/><text x="444" y="105" font-size="15" fill="#1c1f23" font-weight="750" text-anchor="middle"><tspan x="444" dy="0">3. Copiar</tspan></text><text x="444" y="135" font-size="12" fill="#5e6670" font-weight="600" text-anchor="middle"><tspan x="444" dy="0">MQL4/Experts</tspan><tspan x="444" dy="15.0">MQL5/Experts</tspan></text><line x1="519" y1="130" x2="541" y2="130" stroke="#5e6670" stroke-width="2" marker-end="url(#arr)"/><rect x="541" y="70" width="150" height="120" rx="10" fill="#dcefeb" stroke="#0f766e" stroke-width="1.5"/><text x="616" y="105" font-size="15" fill="#1c1f23" font-weight="750" text-anchor="middle"><tspan x="616" dy="0">4. Compilar</tspan></text><text x="616" y="135" font-size="12" fill="#5e6670" font-weight="600" text-anchor="middle"><tspan x="616" dy="0">MetaEditor (F7)</tspan><tspan x="616" dy="15.0">0 errores → .ex4/.ex5</tspan></text><line x1="691" y1="130" x2="713" y2="130" stroke="#5e6670" stroke-width="2" marker-end="url(#arr)"/><rect x="713" y="70" width="150" height="120" rx="10" fill="#fdf0d5" stroke="#b45309" stroke-width="1.5"/><text x="788" y="105" font-size="15" fill="#1c1f23" font-weight="750" text-anchor="middle"><tspan x="788" dy="0">5. Adjuntar</tspan></text><text x="788" y="135" font-size="12" fill="#5e6670" font-weight="600" text-anchor="middle"><tspan x="788" dy="0">símbolo y temporalidad</tspan><tspan x="788" dy="15.0">correctos + permiso</tspan></text><text x="450" y="230" font-size="13.5" fill="#5e6670" font-weight="500" text-anchor="middle"><tspan x="450" dy="0">Después: verificar en el probador antes de dejarlo operar en demo.</tspan></text></svg>