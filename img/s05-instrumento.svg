<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="Ficha de un instrumento" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5e6670"/></marker></defs><rect width="900" height="340" fill="#ffffff"/><text x="450" y="34" font-size="19" fill="#1c1f23" font-weight="700" text-anchor="middle"><tspan x="450" dy="0">Del movimiento del precio al dinero: EUR/USD</tspan></text><rect x="40" y="60" width="330" height="250" rx="10" fill="#fff" stroke="#d9d5cb" stroke-width="1.5"/><text x="205" y="90" font-size="15" fill="#1c1f23" font-weight="700" text-anchor="middle"><tspan x="205" dy="0">Instrumento EURUSD</tspan></text><line x1="60" y1="139" x2="350" y2="139" stroke="#d9d5cb" stroke-width="1"/><text x="64" y="125" font-size="14" fill="#5e6670" font-weight="500" text-anchor="start"><tspan x="64" dy="0">Tamaño del pip</tspan></text><text x="346" y="125" font-size="14.5" fill="#1c1f23" font-weight="700" text-anchor="end"><tspan x="346" dy="0">0,0001</tspan></text><line x1="60" y1="183" x2="350" y2="183" stroke="#d9d5cb" stroke-width="1"/><text x="64" y="169" font-size="14" fill="#5e6670" font-weight="500" text-anchor="start"><tspan x="64" dy="0">Paso del tick</tspan></text><text x="346" y="169" font-size="14.5" fill="#1c1f23" font-weight="700" text-anchor="end"><tspan x="346" dy="0">0,00001</tspan></text><line x1="60" y1="227" x2="350" y2="227" stroke="#d9d5cb" stroke-width="1"/><text x="64" y="213" font-size="14" fill="#5e6670" font-weight="500" text-anchor="start"><tspan x="64" dy="0">Valor del punto</tspan></text><text x="346" y="213" font-size="14.5" fill="#1c1f23" font-weight="700" text-anchor="end"><tspan x="346" dy="0">100.000 $</tspan></text><line x1="60" y1="271" x2="350" y2="271" stroke="#d9d5cb" stroke-width="1"/><text x="64" y="257" font-size="14" fill="#5e6670" font-weight="500" text-anchor="start"><tspan x="64" dy="0">Tipo</tspan></text><text x="346" y="257" font-size="14.5" fill="#1c1f23" font-weight="700" text-anchor="end"><tspan x="346" dy="0">Forex</tspan></text><rect x="420" y="60" width="440" height="250" rx="10" fill="#dcefeb" stroke="#0f766e" stroke-width="1.5"/><text x="640" y="95" font-size="15" fill="#0f766e" font-weight="700" text-anchor="middle"><tspan x="640" dy="0">Valor de un pip de 1 lote</tspan></text><text x="640" y="140" font-size="22" fill="#1c1f23" font-weight="750" text-anchor="middle"><tspan x="640" dy="0">100.000 $ × 0,0001 = 10 $</tspan></text><text x="640" y="190" font-size="14" fill="#1c1f23" font-weight="500" text-anchor="middle"><tspan x="640" dy="0">Una operación de 0,20 lotes que gana 25 pips:</tspan></text><text x="640" y="225" font-size="22" fill="#1c1f23" font-weight="750" text-anchor="middle"><tspan x="640" dy="0">25 × 10 $ × 0,20 = 50 $</tspan></text><text x="640" y="280" font-size="12.5" fill="#5e6670" font-weight="500" text-anchor="middle"><tspan x="640" dy="0">SQX hace esta cuenta en cada operación del backtest</tspan></text></svg>