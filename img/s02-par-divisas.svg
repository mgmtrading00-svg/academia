<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="Anatomía de un par de divisas" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5e6670"/></marker></defs><rect width="900" height="300" fill="#ffffff"/><text x="450" y="34" font-size="19" fill="#1c1f23" font-weight="700" text-anchor="middle"><tspan x="450" dy="0">Cómo se lee una cotización de Forex</tspan></text><text x="190" y="140" font-size="64" fill="#1c1f23" font-weight="750" text-anchor="middle"><tspan x="190" dy="0">EUR</tspan></text><rect x="133.0" y="160" width="114" height="8" rx="3" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190" y="200" font-size="13.5" fill="#0f766e" font-weight="600" text-anchor="middle"><tspan x="190" dy="0">Divisa base</tspan><tspan x="190" dy="16.875">(la que compras)</tspan></text><text x="262" y="140" font-size="64" fill="#1c1f23" font-weight="750" text-anchor="middle"><tspan x="262" dy="0">/</tspan></text><text x="330" y="140" font-size="64" fill="#1c1f23" font-weight="750" text-anchor="middle"><tspan x="330" dy="0">USD</tspan></text><rect x="273.0" y="160" width="114" height="8" rx="3" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.5"/><text x="330" y="200" font-size="13.5" fill="#1d4ed8" font-weight="600" text-anchor="middle"><tspan x="330" dy="0">Divisa cotizada</tspan><tspan x="330" dy="16.875">(la que pagas)</tspan></text><text x="500" y="140" font-size="64" fill="#1c1f23" font-weight="750" text-anchor="middle"><tspan x="500" dy="0">1,08</tspan></text><text x="610" y="140" font-size="64" fill="#1c1f23" font-weight="750" text-anchor="middle"><tspan x="610" dy="0">52</tspan></text><rect x="572.0" y="160" width="76" height="8" rx="3" fill="#c2410c" stroke="#c2410c" stroke-width="1.5"/><text x="610" y="200" font-size="13.5" fill="#c2410c" font-weight="600" text-anchor="middle"><tspan x="610" dy="0">4.º decimal:</tspan><tspan x="610" dy="16.875">1 pip = 0,0001</tspan></text><text x="690" y="140" font-size="64" fill="#1c1f23" font-weight="750" text-anchor="middle"><tspan x="690" dy="0">3</tspan></text><rect x="671.0" y="160" width="38" height="8" rx="3" fill="#b45309" stroke="#b45309" stroke-width="1.5"/><text x="690" y="240" font-size="13.5" fill="#b45309" font-weight="600" text-anchor="middle"><tspan x="690" dy="0">5.º decimal:</tspan><tspan x="690" dy="16.875">1 point = 0,1 pip</tspan></text><text x="610" y="290" font-size="13" fill="#5e6670" font-weight="500" text-anchor="middle"><tspan x="610" dy="0">En los pares con JPY el pip es el 2.º decimal (0,01).</tspan></text></svg>