<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="Árbol de decisión" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5e6670"/></marker></defs><rect width="900" height="360" fill="#ffffff"/><text x="450" y="34" font-size="19" fill="#1c1f23" font-weight="700" text-anchor="middle"><tspan x="450" dy="0">Aceptar, rechazar o repetir</tspan></text><rect x="330" y="60" width="240" height="56" rx="10" fill="#fff" stroke="#1c1f23" stroke-width="1.5"/><text x="450.0" y="93.6" font-size="16" fill="15" font-weight="650" text-anchor="middle"><tspan x="450.0" dy="0">¿Supera todas las pruebas?</tspan></text><rect x="60" y="200" width="220" height="70" rx="10" fill="#dcefeb" stroke="#0f766e" stroke-width="1.5"/><text x="170.0" y="233.0" font-size="16" fill="#1c1f23" font-weight="650" text-anchor="middle"><tspan x="170.0" dy="0">Aceptar</tspan></text><text x="170.0" y="253.0" font-size="12.5" fill="#5e6670" font-weight="400" text-anchor="middle"><tspan x="170.0" dy="0">a la cartera candidata y demo</tspan></text><rect x="340" y="200" width="220" height="70" rx="10" fill="#fbe6da" stroke="#c2410c" stroke-width="1.5"/><text x="450.0" y="233.0" font-size="16" fill="#1c1f23" font-weight="650" text-anchor="middle"><tspan x="450.0" dy="0">Rechazar</tspan></text><text x="450.0" y="253.0" font-size="12.5" fill="#5e6670" font-weight="400" text-anchor="middle"><tspan x="450.0" dy="0">archivar con el motivo</tspan></text><rect x="620" y="200" width="220" height="70" rx="10" fill="#fdf0d5" stroke="#b45309" stroke-width="1.5"/><text x="730.0" y="233.0" font-size="16" fill="#1c1f23" font-weight="650" text-anchor="middle"><tspan x="730.0" dy="0">Repetir</tspan></text><text x="730.0" y="253.0" font-size="12.5" fill="#5e6670" font-weight="400" text-anchor="middle"><tspan x="730.0" dy="0">con la información que falta</tspan></text><line x1="380" y1="116" x2="170" y2="198" stroke="#0f766e" stroke-width="2" marker-end="url(#arr)"/><text x="275.0" y="149.0" font-size="12.5" fill="#5e6670" font-weight="400" text-anchor="middle"><tspan x="275.0" dy="0">sí</tspan></text><line x1="450" y1="116" x2="450" y2="198" stroke="#c2410c" stroke-width="2" marker-end="url(#arr)"/><text x="450.0" y="149.0" font-size="12.5" fill="#5e6670" font-weight="400" text-anchor="middle"><tspan x="450.0" dy="0">falla una eliminatoria</tspan></text><line x1="520" y1="116" x2="730" y2="198" stroke="#b45309" stroke-width="2" marker-end="url(#arr)"/><text x="625.0" y="149.0" font-size="12.5" fill="#5e6670" font-weight="400" text-anchor="middle"><tspan x="625.0" dy="0">dudas por falta de datos</tspan></text><text x="450" y="320" font-size="14" fill="#c2410c" font-weight="700" text-anchor="middle"><tspan x="450" dy="0">Nunca: retocar la estrategia hasta que pase</tspan></text></svg>