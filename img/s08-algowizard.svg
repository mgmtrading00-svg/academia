<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-label="Flujo de trabajo con AlgoWizard" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5e6670"/></marker></defs><rect width="900" height="250" fill="#ffffff"/><text x="450" y="34" font-size="19" fill="#1c1f23" font-weight="700" text-anchor="middle"><tspan x="450" dy="0">Trabajar con AlgoWizard</tspan></text><rect x="30" y="80" width="150" height="90" rx="10" fill="#dcefeb" stroke="#0f766e" stroke-width="1.5"/><text x="105.0" y="123.0" font-size="16" fill="#1c1f23" font-weight="650" text-anchor="middle"><tspan x="105.0" dy="0">1. Hipótesis</tspan></text><text x="105.0" y="143.0" font-size="12.5" fill="#5e6670" font-weight="400" text-anchor="middle"><tspan x="105.0" dy="0">en el cuaderno</tspan></text><line x1="180" y1="125" x2="202" y2="125" stroke="#5e6670" stroke-width="2" marker-end="url(#arr)"/><rect x="202" y="80" width="150" height="90" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5"/><text x="277.0" y="123.0" font-size="16" fill="#1c1f23" font-weight="650" text-anchor="middle"><tspan x="277.0" dy="0">2. Reglas</tspan></text><text x="277.0" y="143.0" font-size="12.5" fill="#5e6670" font-weight="400" text-anchor="middle"><tspan x="277.0" dy="0">entrada, stop, salida</tspan></text><line x1="352" y1="125" x2="374" y2="125" stroke="#5e6670" stroke-width="2" marker-end="url(#arr)"/><rect x="374" y="80" width="150" height="90" rx="10" fill="#dcefeb" stroke="#0f766e" stroke-width="1.5"/><text x="449.0" y="123.0" font-size="16" fill="#1c1f23" font-weight="650" text-anchor="middle"><tspan x="449.0" dy="0">3. Pseudocódigo</tspan></text><text x="449.0" y="143.0" font-size="12.5" fill="#5e6670" font-weight="400" text-anchor="middle"><tspan x="449.0" dy="0">¿dice lo que querías?</tspan></text><line x1="524" y1="125" x2="546" y2="125" stroke="#5e6670" stroke-width="2" marker-end="url(#arr)"/><rect x="546" y="80" width="150" height="90" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5"/><text x="621.0" y="123.0" font-size="16" fill="#1c1f23" font-weight="650" text-anchor="middle"><tspan x="621.0" dy="0">4. Backtest</tspan></text><text x="621.0" y="143.0" font-size="12.5" fill="#5e6670" font-weight="400" text-anchor="middle"><tspan x="621.0" dy="0">IS y OOS, con costes</tspan></text><line x1="696" y1="125" x2="718" y2="125" stroke="#5e6670" stroke-width="2" marker-end="url(#arr)"/><rect x="718" y="80" width="150" height="90" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5"/><text x="793.0" y="123.0" font-size="16" fill="#1c1f23" font-weight="650" text-anchor="middle"><tspan x="793.0" dy="0">5. Filtros</tspan></text><text x="793.0" y="143.0" font-size="12.5" fill="#5e6670" font-weight="400" text-anchor="middle"><tspan x="793.0" dy="0">de uno en uno</tspan></text><text x="450" y="215" font-size="13.5" fill="#5e6670" font-weight="500" text-anchor="middle"><tspan x="450" dy="0">Si el paso 3 no coincide con el 1, la estrategia no es la que crees estar probando.</tspan></text></svg>